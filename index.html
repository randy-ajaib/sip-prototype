<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIP creation — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #3278f0;
  --primary-press: #2264d4;
  --primary-text: #2264d4;
  --tint: #eaf2fe;
  --text: #06090d;
  --text-2: rgba(6, 9, 13, 0.62);
  --text-3: rgba(6, 9, 13, 0.45);
  --surface: #fff;
  --surface-2: #f4f6f6;
  --border: rgba(0, 0, 0, 0.08);
  --border-strong: rgba(0, 0, 0, 0.16);
  --danger: #d02f2f;
  --up: #0f8a4c;
  --down: #d02f2f;
  --header: #0b3fae;
  --disabled-bg: #e4e7eb;
  --disabled-text: rgba(6, 9, 13, 0.4);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: #e6e9ed;
  font-family: Lato, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
input { font: inherit; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }

#stage { min-height: 100%; display: grid; place-items: center; padding: 80px 16px 32px; }
.phone {
  position: relative; width: 390px; height: 844px; background: var(--header);
  border-radius: 44px; overflow: hidden; isolation: isolate; display: flex; flex-direction: column;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 24px 48px rgba(0,0,0,.14), 0 4px 12px rgba(0,0,0,.06);
}
@media (max-width: 430px) {
  #stage { padding: 0; }
  .phone { width: 100vw; height: 100dvh; border-radius: 0; }
}
.main { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* Chrome */
.sb { height: 36px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 4px 28px 0; color: #fff; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.sb svg { display: block; }
.hd { height: 56px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px; color: #fff; }
.hd h1 { font-size: 18px; line-height: 24px; font-weight: 700; }
.hd :focus-visible, .intro :focus-visible { outline-color: #fff; }
.icon-btn { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 0; background: transparent; border-radius: 999px; cursor: pointer; }
.icon-btn[hidden] { display: grid; visibility: hidden; }
.intro { padding: 0 16px 16px; color: #fff; font-size: 14px; line-height: 20px; flex: none; }
.tabs { display: flex; padding: 4px; margin-top: 12px; background: rgba(0,0,0,.2); border-radius: 10px; }
.tab { flex: 1; height: 36px; border: 0; border-radius: 7px; background: transparent; color: rgba(255,255,255,.72); font-size: 14px; cursor: pointer; transition: background-color .15s ease-out, color .15s ease-out; }
.tab[aria-selected="true"] { background: #fff; color: var(--primary-text); font-weight: 700; }

.body { flex: 1; min-height: 0; background: var(--surface); border-radius: 16px 16px 0 0; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.form { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
.footer { flex: none; padding: 12px 16px calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; background: var(--surface); }

/* Rows (Sheets variant) */
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 68px; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--border); background: transparent; text-align: left; cursor: pointer; transition: background-color .15s ease-out; }
.row:disabled { cursor: not-allowed; }
.row:disabled .t { color: var(--text-3); }
.row:active:not(:disabled) { background: var(--surface-2); }
@media (hover: hover) and (pointer: fine) { .row:hover:not(:disabled) { background: var(--surface-2); } }
.row-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.t { font-weight: 700; font-size: 14px; line-height: 20px; }
.s { font-size: 12px; line-height: 16px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-end { display: flex; align-items: center; gap: 2px; color: var(--text-2); font-size: 12px; }
.row-end svg { color: var(--text); }

.logo { width: 32px; height: 32px; flex: none; border-radius: 999px; display: grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .02em; user-select: none; }
.logo.lg { width: 40px; height: 40px; font-size: 11px; }
.logo.ph { background: var(--surface-2); color: var(--text-2); }

/* Stock list */
.search { position: relative; margin: 0 16px 8px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--text-3); }
.search input { width: 100%; height: 44px; border-radius: 10px; border: 1px solid transparent; background: var(--surface-2); padding: 0 12px 0 40px; font-size: 16px; color: var(--text); }
.search input::placeholder { color: var(--text-3); }
.search input:focus { background: #fff; border-color: var(--border-strong); }
.stock { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 16px; border: 0; background: transparent; text-align: left; cursor: pointer; transition: background-color .15s ease-out; }
.stock:active { background: var(--surface-2); }
@media (hover: hover) and (pointer: fine) { .stock:hover { background: var(--surface-2); } }
.stock .row-meta { gap: 0; }
.px { text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; line-height: 20px; flex: none; }
.chg { display: block; font-size: 12px; line-height: 16px; }
.chg.up { color: var(--up); } .chg.down { color: var(--down); }
.stock .tick { width: 20px; flex: none; color: var(--primary); }
.stock[aria-pressed="true"] { background: var(--tint); }
.list-empty { padding: 32px 24px; text-align: center; color: var(--text-2); font-size: 14px; line-height: 20px; }
.list-empty b { color: var(--text); display: block; margin-bottom: 4px; }

/* Schedule editor */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; background: var(--surface-2); border-radius: 10px; }
.seg button { height: 40px; border: 0; border-radius: 7px; background: transparent; color: var(--text-2); font-size: 14px; font-weight: 700; cursor: pointer; transition: background-color .15s ease-out, color .15s ease-out, box-shadow .15s ease-out; }
.seg button[aria-checked="true"] { background: #fff; color: var(--text); box-shadow: 0 0 0 1px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.04); }
.sub { display: flex; flex-direction: column; gap: 10px; }
.lbl { font-size: 12px; line-height: 16px; color: var(--text-2); font-weight: 700; }
.days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.dates { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.chip { height: 44px; border-radius: 10px; border: 1px solid var(--border-strong); background: #fff; font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; font-variant-numeric: tabular-nums; transition: background-color .15s ease-out, border-color .15s ease-out, color .15s ease-out, transform .16s var(--ease-out); }
.chip:active { transform: scale(.96); }
.chip[aria-checked="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
.note { display: flex; gap: 6px; font-size: 12px; line-height: 16px; color: var(--text-2); }
.note svg { flex: none; margin-top: 0; }
.desc { padding: 12px; border-radius: 10px; background: var(--surface-2); font-size: 14px; line-height: 20px; color: var(--text-2); }
.desc b { color: var(--text); }
.editor { display: flex; flex-direction: column; gap: 16px; }

/* Amount */
.field { display: flex; flex-direction: column; gap: 8px; }
.field label { font-size: 14px; line-height: 20px; font-weight: 700; }
.amt { position: relative; }
.amt .pre { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; font-weight: 700; font-size: 16px; }
.amt input { width: 100%; height: 48px; border-radius: 10px; border: 1px solid var(--border-strong); background: #fff; padding: 0 14px 0 28px; font-size: 16px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; transition: border-color .15s ease-out; }
.amt input:focus { border-color: var(--primary); }
.amt input[aria-invalid="true"] { border-color: var(--danger); }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.qchip { position: relative; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border-strong); background: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums; transition: background-color .15s ease-out, border-color .15s ease-out, color .15s ease-out, transform .16s var(--ease-out); }
.qchip::before { content: ""; position: absolute; inset: -6px -4px; }
.qchip:active { transform: scale(.96); }
.qchip[aria-pressed="true"] { background: var(--tint); border-color: var(--primary); color: var(--primary-text); }
.err { display: flex; align-items: center; gap: 6px; color: var(--danger); font-size: 12px; line-height: 16px; }
.err:empty { display: none; }
.hint { font-size: 12px; line-height: 16px; color: var(--text-2); }

/* Footer bits */
.info { display: flex; gap: 8px; padding: 12px; border-radius: 10px; background: var(--surface-2); font-size: 12px; line-height: 16px; color: var(--text-2); text-wrap: pretty; }
.info svg { flex: none; color: var(--text-2); }
.info b { color: var(--text); font-variant-numeric: tabular-nums; }
.fund { display: flex; justify-content: space-between; align-items: center; font-size: 14px; line-height: 20px; }
.fund .k { color: var(--text-2); }
.fund > span:last-child { font-weight: 700; font-size: 12px; }
.tag { display: inline-block; font-size: 10px; line-height: 16px; padding: 0 6px; border-radius: 4px; background: var(--tint); color: var(--primary-text); margin-left: 6px; vertical-align: 1px; }
.cta { position: relative; height: 48px; width: 100%; border: 0; border-radius: 10px; background: var(--primary); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .16s var(--ease-out), background-color .15s ease-out; }
.cta:active:not(:disabled) { transform: scale(.97); background: var(--primary-press); }
.cta:disabled { background: var(--disabled-bg); color: var(--disabled-text); cursor: not-allowed; }
.cta[data-loading] { background: var(--primary); color: #fff; cursor: progress; }
.cta.ghost { background: transparent; color: var(--primary-text); }
.spin { width: 18px; height: 18px; border-radius: 999px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Sheet */
.overlay { position: absolute; inset: 0; z-index: 10; }
.backdrop { position: absolute; inset: 0; background: rgba(6,9,13,.42); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 86%; background: #fff; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; }
.sheet.fit { height: auto; max-height: 86%; }
.overlay.closing .backdrop { animation: fadeOut .2s ease-in forwards; }
.overlay.closing .sheet { animation: sheetOut .2s ease-in forwards; }
.grab { width: 36px; height: 4px; border-radius: 999px; background: rgba(0,0,0,.14); margin: 8px auto 0; flex: none; }
.sheet-hd { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 8px 16px; flex: none; }
.sheet-hd h2 { font-size: 18px; line-height: 24px; font-weight: 700; }
.sheet-body { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
.preview { font-size: 14px; line-height: 20px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.preview b { color: var(--text); }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes sheetIn { from { transform: translateY(100%); } }
@keyframes sheetOut { to { transform: translateY(100%); } }

/* Stepper */
.progress { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 0 16px 16px; flex: none; }
.progress span { height: 4px; border-radius: 999px; background: rgba(255,255,255,.25); overflow: hidden; }
.progress span::after { content: ""; display: block; height: 100%; background: #fff; transform: scaleX(0); transform-origin: left; transition: transform .3s var(--ease-out); }
.progress span[data-on]::after { transform: scaleX(1); }
.step { flex: 1; min-height: 0; display: flex; flex-direction: column; animation: stepIn .28s var(--ease-out); }
@keyframes stepIn { from { opacity: 0; transform: translateX(var(--dx, 16px)); } }
.step-hd { padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-size: 12px; line-height: 16px; color: var(--text-2); font-weight: 700; }
.step-hd h2 { font-size: 20px; line-height: 28px; font-weight: 700; text-wrap: balance; }
.picked { display: flex; align-items: center; gap: 10px; margin: 0 16px 16px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.link { position: relative; border: 0; background: transparent; color: var(--primary-text); font-weight: 700; font-size: 14px; cursor: pointer; padding: 0 4px; height: 32px; }
.link::before { content: ""; position: absolute; inset: -6px -4px; }
.opts { display: flex; flex-direction: column; gap: 10px; padding: 0 16px 16px; }
.opt { border: 1px solid var(--border-strong); border-radius: 12px; transition: border-color .15s ease-out, box-shadow .15s ease-out; }
.opt[data-on] { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.opt-btn { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 12px 14px; border: 0; background: transparent; text-align: left; cursor: pointer; border-radius: 12px; }
.radio { width: 20px; height: 20px; flex: none; border-radius: 999px; border: 2px solid var(--border-strong); display: grid; place-items: center; transition: border-color .15s ease-out; }
.radio::after { content: ""; width: 10px; height: 10px; border-radius: 999px; background: var(--primary); transform: scale(0); transition: transform .2s var(--ease-out); }
.opt[data-on] .radio { border-color: var(--primary); }
.opt[data-on] .radio::after { transform: scale(1); }
.opt .s { white-space: normal; }
.opt-sub { padding: 0 14px 14px; animation: fadeIn .2s ease-out; }
.big-amt { display: flex; align-items: center; justify-content: center; gap: 2px; padding: 8px 16px 4px; font-size: 40px; line-height: 48px; font-weight: 700; font-variant-numeric: tabular-nums; }
.big-amt input { max-width: 8ch; border: 0; padding: 0; font-size: 40px; font-weight: 700; color: var(--text); background: transparent; font-variant-numeric: tabular-nums; text-align: left; border-bottom: 2px solid var(--border-strong); transition: border-color .15s ease-out; }
.big-amt input:focus { outline: none; border-bottom-color: var(--primary); }
.big-amt input[aria-invalid="true"] { border-bottom-color: var(--danger); }
.center { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 0 16px 20px; }
.review { margin: 0 16px 16px; border: 1px solid var(--border); border-radius: 12px; padding: 4px 14px; }
.review div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; font-size: 14px; line-height: 20px; }
.review div + div { border-top: 1px solid var(--border); }
.review dt { color: var(--text-2); flex: none; }
.review dd { margin: 0; font-weight: 700; text-align: right; min-width: 0; font-variant-numeric: tabular-nums; }

/* Sentence */
.sentence { padding: 24px 16px 20px; font-size: 24px; line-height: 44px; font-weight: 700; letter-spacing: -.01em; text-wrap: pretty; }
.tok { display: inline; font: inherit; border: 0; padding: 4px 8px; margin: 0 1px; border-radius: 8px; background: var(--tint); color: var(--primary-text); cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; font-variant-numeric: tabular-nums; transition: background-color .15s ease-out, color .15s ease-out; }
.tok[data-empty] { background: transparent; color: var(--text-3); text-decoration: underline 2px dashed; text-underline-offset: 6px; padding: 4px 2px; }
.tok[aria-expanded="true"] { background: var(--primary); color: #fff; text-decoration: none; padding: 4px 8px; }
.panel { border-top: 1px solid var(--border); padding: 16px 0 8px; }
.panel-hd { padding: 0 16px 12px; display: flex; justify-content: space-between; align-items: center; }
.panel-pad { padding: 0 16px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px; }
.stat { padding: 12px; border-radius: 10px; background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-size: 16px; line-height: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Success + plans */
.done { flex: 1; display: flex; flex-direction: column; padding: 40px 16px calc(20px + env(safe-area-inset-bottom)); }
.done-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; margin-bottom: 24px; }
.done-check { width: 64px; height: 64px; border-radius: 999px; background: #e3f5ec; color: var(--up); display: grid; place-items: center; margin-bottom: 8px; animation: pop .45s var(--ease-out); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
.done-hero h2 { font-size: 20px; line-height: 28px; }
.done-hero p { font-size: 14px; line-height: 20px; color: var(--text-2); max-width: 30ch; }
.done .review { margin: 0 0 auto; }
.done-actions { display: flex; flex-direction: column; gap: 4px; margin-top: 16px; }
.plans { padding: 8px 0; }
.plan { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.plan .amtv { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; padding: 32px; }
.empty .ic { width: 56px; height: 56px; border-radius: 999px; background: var(--surface-2); display: grid; place-items: center; color: var(--text-2); margin-bottom: 8px; }
.empty p { font-size: 14px; line-height: 20px; color: var(--text-2); max-width: 28ch; }
.empty .cta { width: auto; padding: 0 24px; margin-top: 12px; }

@media (prefers-reduced-motion: reduce) {
  .phone *, .phone *::before, .phone *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}


/* ---------- Round 2 ---------- */
.overlay.enter .backdrop { animation: fadeIn .3s ease-out; }
.overlay.enter .sheet { animation: sheetIn .4s var(--ease-drawer); }
.page { position: absolute; inset: 0; z-index: 5; background: #fff; display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(0,0,0,.08); }
.page.enter { animation: pageIn .4s var(--ease-drawer); }
.page.leaving { animation: pageOut .24s ease-in forwards; }
.page.gone { visibility: hidden; }
@keyframes pageIn { from { transform: translateX(100%); } }
@keyframes pageOut { to { transform: translateX(100%); } }
.page-top { background: var(--header); flex: none; padding-bottom: 4px; }
.page-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 12px; }

.num { width: 32px; height: 32px; flex: none; border-radius: 999px; display: grid; place-items: center; font-size: 14px; font-weight: 700; background: var(--surface-2); color: var(--text-3); font-variant-numeric: tabular-nums; }
.num[data-state="active"] { background: var(--primary); color: #fff; }
.num[data-state="done"] { background: #e3f5ec; color: var(--up); }
.s.cue { color: var(--primary-text); font-weight: 700; }

.basis { display: flex; gap: 6px; align-items: flex-start; margin: 0 16px 12px; font-size: 12px; line-height: 16px; color: var(--text-2); }
.basis svg { flex: none; }
.basis b { color: var(--text); }
.sort { display: flex; gap: 8px; padding: 0 16px 8px; }
.qchip[aria-checked="true"] { background: var(--tint); border-color: var(--primary); color: var(--primary-text); }
.gain { flex: none; display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; }
.pct { font-weight: 700; font-size: 16px; line-height: 22px; font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); }
.pill { display: inline-block; font-size: 12px; line-height: 16px; padding: 2px 6px; border-radius: 6px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pill.up { background: #e3f5ec; } .pill.down { background: #fdeaea; }
.disc { padding: 16px 16px 24px; font-size: 12px; line-height: 16px; color: var(--text-3); text-wrap: pretty; }

.cards { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 8px; }
.card { display: flex; flex-direction: column; gap: 12px; width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: #fff; text-align: left; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.03); transition: transform .16s var(--ease-out), border-color .15s ease-out; }
.card:active { transform: scale(.98); }
@media (hover: hover) and (pointer: fine) { .card:hover { border-color: var(--border-strong); } }
.card-hd { display: flex; align-items: center; gap: 10px; }
.card-ft { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; line-height: 16px; color: var(--text-2); }
.card-ft b { display: block; color: var(--text); font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums; }
.card-ft span:last-child { text-align: right; }
.chart { display: block; width: 100%; height: 72px; overflow: visible; }
.chart.lg { height: 120px; }
.legend { display: flex; gap: 16px; font-size: 12px; line-height: 16px; color: var(--text-2); }

/* ================= 1-year recurring-buy simulation ================= */
const RISK = { AAPL: [.14, .035], NVDA: [.42, .06], TSM: [.38, .05], MSFT: [.11, .03], GOOGL: [.29, .045], AMZN: [.08, .04], 'BRK.B': [.05, .022], VOO: [.15, .022], META: [.21, .05], TSLA: [.33, .08], KO: [-.04, .02], QQQ: [.19, .03], NFLX: [.36, .055], PG: [-.07, .02], RDDT: [.85, .09] };
// Annualized 3- and 5-year returns (simulated). null = not listed long enough.
const LONG = { AAPL: [.18, .22], NVDA: [.62, .58], TSM: [.35, .27], MSFT: [.19, .20], GOOGL: [.24, .19], AMZN: [.16, .12], 'BRK.B': [.14, .13], VOO: [.16, .14], META: [.45, .21], TSLA: [.08, .34], KO: [.04, .06], QQQ: [.21, .18], NFLX: [.38, .17], PG: [.02, .05], RDDT: [null, null] };
const retP = (s, y = 1) => y === 1 ? ret(s) : LONG[s.t][y === 3 ? 0 : 1] == null ? null : LONG[s.t][y === 3 ? 0 : 1] * 100;
function seedOf(t) { let h = 2166136261; for (const c of t) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const SERIES = {};
// 53 weekly closes ending at today's price; a Brownian bridge pins the 1-year return.
function series(s) {
  if (SERIES[s.t]) return SERIES[s.t];
  const [r1, vol] = RISK[s.t], r = rng(seedOf(s.t)), N = 52, w = [0];
  for (let i = 1; i <= N; i++) w.push(w[i - 1] + gauss(r) * vol);
  const p0 = s.p / (1 + r1);
  return SERIES[s.t] = w.map((x, i) => p0 * Math.exp(i / N * Math.log(1 + r1) + x - i / N * w[N]));

// Backtest over the last `months` months (max 12) of the weekly series.
function sim(s, amt, freq = 'weekly', months = 12) {

  const buys = new Set(freq === 'monthly' ? Array.from({ length: months }, (_, i) => start + Math.round(i * 52 / 12)) : Array.from({ length: 52 - start }, (_, i) => start + i));

  for (let i = start; i <= 52; i++) {
    if (buys.has(i)) { const a = amt * BUYS_PER_WEEK[freq]; sh += a / px[i]; inv += a; }
    curve.push({ inv, val: sh * px[i] });
  }
  const val = sh * px[52];
  return { inv, val, gain: val - inv, pct: inv ? (val / inv - 1) * 100 : 0, curve };
}
const BASIS = 10;
const usd0 = n => '$' + Math.round(n).toLocaleString('en-US');
const pctTxt = p => (p >= 0 ? '+' : '−') + Math.abs(p).toFixed(1) + '%';
const gainTxt = g => (g >= 0 ? '+' : '−') + usd0(Math.abs(g));
const dir = n => n >= 0 ? 'up' : 'down';
const FREQ_PER = { daily: 'tiap hari bursa', weekly: 'tiap minggu', monthly: 'tiap bulan' };
const START = `${MONTHS[TODAY.getMonth()]} ${TODAY.getFullYear() - 1}`;
const END_OPTS = [['forever', 'Sampai dihapus'], [1, '1 bulan'], [3, '3 bulan'], [6, '6 bulan'], [12, '12 bulan']];
const endVal = v => v === 'forever' ? 'forever' : +v;

const endLong = s => s.end === 'forever' ? 'Sampai dihapus' : `${s.end} bulan · s.d. ${fmtDate(buyDates(s).at(-1))}`;
function addMonths(d, n) { const r = new Date(d.getFullYear(), d.getMonth() + n, 1); r.setDate(Math.min(d.getDate(), new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate())); return r; }
// Every purchase date of a finite plan, starting at the first debit.
function buyDates(s) {
  const first = firstDebit(s), stop = addMonths(first, s.end), out = [];
  if (s.freq === 'monthly') {
    // Start from the month of the scheduled (un-rolled) date, so a 31 Okt → 2 Nov roll still counts as October's buy.
    const tmr = new Date(TODAY); tmr.setDate(tmr.getDate() + 1);
    const on = (y, m) => new Date(y, m, Math.min(s.date, new Date(y, m + 1, 0).getDate()));
    let m0 = tmr.getMonth(); while (on(tmr.getFullYear(), m0) < tmr) m0++;
    for (let i = 0; i < s.end; i++) out.push(nextTrading(on(tmr.getFullYear(), m0 + i)));

      simend(v) { st.simEnd = endVal(v); ctx.patch('[data-simend]', endChips(st.simEnd, 'simend')); ctx.patch('[data-simhint]', simHint(st, true)); ctx.patch('[data-proj]', V.proj(st)); },
      quick(v) { st.draftAmt = v; st.amtErr = ''; const i = phone.querySelector('[data-amt]'); if (i) { i.value = v; if (i.closest('.big-amt')) i.style.width = Math.max(2, v.length) + 0.6 + 'ch'; } syncAmt(); },

      sort(v) { st.sort = v; ctx.patch('[data-sort]', V.sortChips(st)); ctx.patch('[data-list]', V.list(st)); },
      simfreq(v) { st.simFreq = v; ctx.patch('[data-simseg]', amtSeg(v)); ctx.patch('[data-proj]', V.proj(st)); },
      confirmAmt() { if (!amtError(st.draftAmt)) V.confirm(ctx); },
      pcPick(v) { st.stock = v; ctx.openSheet('nominal'); },
      openSort() { ctx.openSheet('sort'); },
      openCat() { ctx.openSheet('cat'); },
      setSort(v) { st.sort = v; ctx.closeSheet(() => ctx.focus('[data-k="chip-sort"]')); },
      setCat(v) { st.cat = v; ctx.closeSheet(() => ctx.focus('[data-k="chip-cat"]')); },
      openPeriod() { ctx.openSheet('period'); },
      setPeriodSheet(v) { st.period = +v; ctx.closeSheet(() => ctx.focus('[data-k="chip-period"]')); },
      setPeriod(v) { st.period = +v; ctx.patch('[data-head]', V.head(st)); ctx.patch('[data-list]', V.list(st)); phone.querySelector('[data-list]').scrollTop = 0; },
      setCatInline(v) { st.cat = v; ctx.patch('[data-head]', V.head(st)); ctx.patch('[data-list]', V.list(st)); phone.querySelector('[data-list]').scrollTop = 0; },
      changeStock() { if (st.pages.length > 1) ctx.pop(); else { st.pages = [{ id: 'stock' }]; st.enter = 'page'; ctx.render(); } },
    };
    function patchSched() { ctx.patch('[data-sched]', schedBody(st.draft, st)); ctx.patch('[data-sched-ft]', saveBtn(st.draft)); }
    function syncAmt() {
      const input = phone.querySelector('[data-amt]');
      if (input) { input.setAttribute('aria-invalid', String(!!st.amtErr)); const err = phone.querySelector('[data-err]'); if (err) err.innerHTML = st.amtErr ? svg('info', 16) + st.amtErr : ''; }
      ctx.patch('[data-quick]', quickChips(parseAmt(st.draftAmt)));
      ctx.patch('[data-proj]', V.proj(st));
      const c = phone.querySelector('[data-k="confirmAmt"]'); if (c) c.disabled = !!amtError(st.draftAmt);
    }
    ctx.submit = () => { st.agree = false; st.terms = false; ctx.openSheet('confirm'); };

    phone.addEventListener('click', e => {
      const b = e.target.closest('[data-a]');
      if (!b || !phone.contains(b) || b.disabled) return;
      H[b.dataset.a]?.(b.dataset.v, b);
    });
    phone.addEventListener('submit', e => { e.preventDefault(); if (ready(st.stock, st.s, st.amount)) ctx.submit(); });
    phone.addEventListener('input', e => {
      if (e.target.matches('[data-search]')) { st.q = e.target.value; ctx.patch('[data-list]', V.list(st)); }
      if (e.target.matches('[data-amt]')) {
        st.draftAmt = e.target.value; if (st.amtErr) st.amtErr = amtError(st.draftAmt);
        if (e.target.closest('.big-amt')) e.target.style.width = Math.max(2, e.target.value.length) + 0.6 + 'ch';
        syncAmt();
      }
    });
    phone.addEventListener('focusout', e => { if (e.target.matches('[data-amt]')) { st.amtErr = amtError(st.draftAmt); syncAmt(); } });
    phone.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.matches('[data-search]')) {
        e.preventDefault(); const first = phone.querySelector('[data-list] [data-a="pick"]'); if (first) H.pick(first.dataset.v);
      }
      if (e.key === 'Enter' && e.target.matches('[data-amt]')) { e.preventDefault(); H.confirmAmt(); }
      if (e.key === 'Escape') { if (st.sheet) H.close(); else if (st.pages.length) ctx.pop(); }
    });
    V.init?.(st);
    ctx.render();
    if (V.autoConfirm) ctx.submit();
    if (V.autoStock) { st.pages = [{ id: 'stock' }]; ctx.render(); }
  };
}

const PERIODS = [[4, '1B'], [13, '3B'], [26, '6B'], [52, '1T']];
const PERIOD_LONG = { 4: '1 bulan', 13: '3 bulan', 26: '6 bulan', 52: '1 tahun' };
const ret = (s, weeks = 52) => { const px = series(s); return (px[52] / px[52 - weeks] - 1) * 100; };
const RET_DISC = 'Return adalah perubahan harga saham pada periode tersebut. Kinerja masa lalu tidak menjamin hasil di masa depan.';
function spark(s, w = 64, h = 28) {
  const px = series(s), lo = Math.min(...px), hi = Math.max(...px);
  const d = px.map((p, i) => `${i ? 'L' : 'M'}${(i / 52 * w).toFixed(1)},${(h - 2 - (p - lo) / (hi - lo || 1) * (h - 4)).toFixed(1)}`).join('');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" style="stroke:var(--${dir(ret(s))})" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}
const retRow = (st, s, right) => `<button type="button" class="stock" data-a="pick" data-v="${s.t}" data-k="pick-${s.t}" aria-pressed="${st.stock === s.t}">

const lots = (s, amt) => (amt / s.p).toLocaleString('id-ID', { maximumFractionDigits: 4 });

/* ================= Confirmation summary explorations ================= */
const cfAgree = st => `<hr class="cf-hr">
  <div class="cf-agree"><input type="checkbox" id="agree" data-a="agree" ${st.agree ? 'checked' : ''}>
    <span><label for="agree">Saya telah membaca dan memahami </label><button type="button" class="tlink" data-a="terms" data-k="terms" aria-expanded="${!!st.terms}">Syarat dan Ketentuan</button><label for="agree"> Systematic Investment Plan (SIP), serta menyetujui untuk memilih portofolio yang mungkin mengandung risiko.</label></span></div>

// Upcoming purchase dates; "until deleted" plans are projected 12 months out.
const upcoming = s => buyDates({ ...s, end: s.end === 'forever' ? 12 : s.end });
const perMonthNum = (s, amt) => parseAmt(amt) * PER_MONTH[s.freq];
const when = s => s.freq === 'daily' ? 'setiap hari bursa' : s.freq === 'weekly' ? 'setiap ' + DAY_L[s.day] : 'setiap tanggal ' + s.date;

// 2 · Sentence
function confirmSentence(st) {
  const s = byT(st.stock), p = st.s, a = parseAmt(st.amount), d = upcoming(p);
  const dur = p.end === 'forever' ? 'sampai kamu hapus' : `selama <b>${p.end} bulan</b>`;
  const commit = p.end === 'forever'
    ? `≈ <b>${usd(Math.round(perMonthNum(p, a)))}</b> per bulan · berjalan terus sampai rencana dihapus`
    : `<b>${d.length} pembelian</b> · total <b>${usd(d.length * a)}</b> · terakhir ${fmtDate(d.at(-1))}`;
  return { title: 'Konfirmasi SIP', fit: true, closeLeft: true, body: `<div class="sheet-body confirm">
    ${cfStock(s)}
    <p class="cf-sentence">Beli <b>${usd(a)}</b> saham ${s.t} ${when(p).replace(/^setiap (.*)$/, 'setiap <b>$1</b>')}, mulai <b>${fmtLong(firstDebit(p))}</b>, ${dur}.</p>
    <div class="cf-commit">${svg('cal', 16)}<span>${commit}</span></div>
    <div class="cf-rows"><div><dt>Sumber Dana</dt><dd>Rekening Saham AS<span class="tag">Autodebit</span></dd></div></div>
    ${cfAgree(st)}</div>${cfFoot(st)}` };
}

// 3 · Timeline
function confirmTimeline(st) {
  const s = byT(st.stock), p = st.s, a = parseAmt(st.amount), d = upcoming(p);
  const head = d.slice(0, 3), finite = p.end !== 'forever';
  const rest = finite ? d.length - 4 : 0;
  const item = (date, label, cls = '') => `<li class="tl-i ${cls}"><span class="tl-dot" aria-hidden="true"></span><span class="tl-d">${label}</span><span class="tl-v">${date}</span></li>`;
  const lbl = i => finite && d.length === 1 ? 'Satu-satunya pembelian' : i === 0 ? 'Pembelian pertama' : finite && i === d.length - 1 ? `Pembelian terakhir (ke-${i + 1})` : `Pembelian ke-${i + 1}`;
  let items = head.map((x, i) => item(fmtDate(x), lbl(i), i === 0 ? 'first' : finite && i === d.length - 1 ? 'last' : '')).join('');
  if (finite && d.length > 3) {
    if (rest > 0) items += `<li class="tl-i gap"><span class="tl-dot" aria-hidden="true"></span><span class="tl-d">${rest} pembelian lagi, ${when(p)}</span></li>`;
    items += item(fmtDate(d.at(-1)), `Pembelian terakhir (ke-${d.length})`, 'last');
  } else if (!finite) items += `<li class="tl-i gap open"><span class="tl-dot" aria-hidden="true"></span><span class="tl-d">Berlanjut ${when(p)} sampai kamu hapus</span></li>`;
  return { title: 'Konfirmasi SIP', fit: true, closeLeft: true, body: `<div class="sheet-body confirm">
    ${cfStock(s, `<span class="cf-per"><b>${usd(a)}</b><span class="s">per pembelian</span></span>`)}
    <ol class="tl" aria-label="Jadwal pembelian">${items}</ol>
    <dl class="cf-rows">
      <div><dt>${finite ? 'Total dana' : 'Estimasi per bulan'}</dt><dd>${finite ? usd(d.length * a) : '≈ ' + usd(Math.round(perMonthNum(p, a)))}</dd></div>
      <div><dt>Sumber Dana</dt><dd>Rekening Saham AS</dd></div></dl>
    ${cfAgree(st)}</div>${cfFoot(st)}` };
}

// 4 · Stats + calendar
function miniCal(p) {
  // Late-month starts would show a near-empty month, so jump to the next full month when possible.
  const d = upcoming(p), first = d[0], late = first.getDate() > 21 && d.some(x => x.getMonth() !== first.getMonth());

      <button type="button" class="fchip" data-a="openCat" data-k="chip-cat" aria-haspopup="dialog">${svg('filter', 16)}${catLabel(st)}</button></div>
    <div class="tabs-sub"><p class="retnote"><span class="retnote-ic">${svg('stock', 14)}</span>${y === 1 ? 'Return saham 1 tahun terakhir' : `Rata-rata return per tahun, ${y} tahun terakhir`}</p>
      <button type="button" class="link" data-a="openSort" data-k="chip-sort">${svg('sort', 14)} ${sortLabel(st)}</button></div>`; },
  list: st => listOrEmpty(st, stockQuery(st), s => figRow(st, s)),
};
const svFigma2 = app({ ...sparkCfg, lightPage: true,
  page: (p, st) => ({ title: slFigma2.title, body: `<div class="fig-head" data-head>${slFigma2.head(st)}</div><div class="scroll" data-list>${slFigma2.list(st)}</div>` }),
  list: slFigma2.list, head: slFigma2.head, init: st => { st.sort = 'top'; st.cat = 'all'; st.period = 1; st.figPeriod = true; } });
const variants = [svFigma2];
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = ''; variants[i](stage); });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
